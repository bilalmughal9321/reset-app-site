document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

n;\">\n      <a href=\"index.html\" style=\"display: flex; align-items: center; gap: 10px;\">\n        <div style=\"width: 30px; height: 30px; border-radius: 999px; background: linear-gradient(150deg, #C9AA9E, #B08D80); display: flex; align-items: center; justify-content: center; flex-shrink: 0;\"><span style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:700;color:#FFF9F2;font-size:16px;\">R<\u002Fspan><\u002Fdiv>\n        <span style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 19px; color: #3A2A22;\">Reset<\u002Fspan>\n      <\u002Fa>\n      <a href=\"index.html\" style=\"font-size: 14px; font-weight: 600; color: #5C4A42;\">← Back to Home<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 800px; margin: 0 auto; padding: 56px 32px 90px;\">\n    <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #B08D80;\">LEGAL<\u002Fdiv>\n    <div style=\"margin-top: 10px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 42px; color: #3A2A22;\">Privacy Policy<\u002Fdiv>\n    <div style=\"margin-top: 10px; font-size: 13.5px; color: #9C8A80;\">Effective Date: April 25, 2026 · Last Updated: April 25, 2026<\u002Fdiv>\n\n    <div style=\"margin-top: 30px; background: #fff; border-radius: 18px; padding: 22px 24px; font-size: 15px; line-height: 1.7; color: #5C4A42; box-shadow: 0 12px 24px -20px rgba(120,95,80,.5);\">\n      <strong style=\"color: #3A2A22;\">Your privacy matters to us.<\u002Fstrong> This Privacy Policy explains how <strong style=\"color: #3A2A22;\">Reset<\u002Fstrong> (\"we\", \"us\", or \"our\") collects, uses, and protects your personal information when you use our mobile application. By using Reset, you agree to the practices described in this policy.\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">1. About Reset<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">Reset is a wellness and habit-tracking application available on iOS. The app helps users build lasting daily habits, practise mindfulness through guided meditations, reflect through daily journaling, and access curated wellness e-books.<\u002Fp>\n    <div style=\"margin-top: 14px; background: #fff; border-radius: 14px; padding: 16px 20px; font-size: 14px; line-height: 1.8; color: #5C4A42; box-shadow: 0 10px 20px -18px rgba(120,95,80,.4);\">\n      <strong style=\"color: #3A2A22;\">App Name:<\u002Fstrong> Reset<br>\n      <strong style=\"color: #3A2A22;\">Bundle Identifier:<\u002Fstrong> com.healthTracks.app<br>\n      <strong style=\"color: #3A2A22;\">Developer:<\u002Fstrong> HealthTracks<br>\n      <strong style=\"color: #3A2A22;\">Contact:<\u002Fstrong> Laura@resetapp.co\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">2. Information We Collect<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">We collect the following types of information to provide and improve our service:<\u002Fp>\n\n    <div style=\"margin-top: 18px; font-size: 16px; font-weight: 700; color: #3A2A22;\">2.1 Account &amp; Profile Information<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">When you register for an account, we collect:<\u002Fp>\n    <div style=\"margin-top: 8px; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 20px -18px rgba(120,95,80,.4);\">\n      <sc-raw-table>\n        <sc-raw-tr><sc-raw-th>Data<\u002Fsc-raw-th><sc-raw-th>Purpose<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>First &amp; Last Name<\u002Fsc-raw-td><sc-raw-td>Personalise your in-app experience<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Email Address<\u002Fsc-raw-td><sc-raw-td>Account login and communication<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Password<\u002Fsc-raw-td><sc-raw-td>Account authentication<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Date of Birth<\u002Fsc-raw-td><sc-raw-td>Optional profile information — not required to use the app<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Country<\u002Fsc-raw-td><sc-raw-td>Optional profile information — not required to use the app<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Phone Number<\u002Fsc-raw-td><sc-raw-td>Optional profile information — not required to use the app<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Profile Photo<\u002Fsc-raw-td><sc-raw-td>Display in your in-app profile. Uploaded voluntarily by tapping your avatar on the Profile screen; stored in Firebase Storage.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n\n    <div style=\"margin-top: 22px; font-size: 16px; font-weight: 700; color: #3A2A22;\">2.2 Usage &amp; Activity Data<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">We collect data generated by your use of the app to power core features:<\u002Fp>\n    <ul style=\"font-size: 15px; line-height: 1.85; color: #5C4A42; padding-left: 20px;\">\n      <li>Habit creation, completion records, and reminder settings<\u002Fli>\n      <li>Streak counts and last-completion timestamps<\u002Fli>\n      <li>Daily active days history<\u002Fli>\n      <li>Journal entries and responses to guided questions<\u002Fli>\n      <li>Meditation sessions selected and listened to<\u002Fli>\n      <li>E-books accessed and reading history<\u002Fli>\n    <\u002Ful>\n\n    <div style=\"margin-top: 22px; font-size: 16px; font-weight: 700; color: #3A2A22;\">2.3 Photo Library Access<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">When you choose to upload a profile photo, the app requests access to your device's photo library. This permission is used solely to let you select an image to display on your profile. The selected photo is uploaded to and stored in Firebase Storage. You are never required to upload a photo — it is entirely optional. You can remove or change your profile photo at any time from the Profile screen.<\u002Fp>\n\n    <div style=\"margin-top: 22px; font-size: 16px; font-weight: 700; color: #3A2A22;\">2.4 What We Do NOT Collect<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">We do not collect device identifiers, crash logs, precise location data, or any analytics data. The app does not include any analytics or crash-reporting SDKs.<\u002Fp>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">3. How We Use Your Information<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">We use the information we collect solely for the following purposes:<\u002Fp>\n    <ul style=\"font-size: 15px; line-height: 1.85; color: #5C4A42; padding-left: 20px;\">\n      <li>To create and manage your account<\u002Fli>\n      <li>To provide all app features (habit tracking, journaling, meditation, e-books)<\u002Fli>\n      <li>To display your progress, streaks, and active days<\u002Fli>\n      <li>To send local notifications and habit reminders (on-device only)<\u002Fli>\n      <li>To respond to your support requests and improve the app based on your feedback<\u002Fli>\n    <\u002Ful>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\"><strong style=\"color: #3A2A22;\">We do not sell your personal data.<\u002Fstrong> We do not use your information for targeted advertising or share it with third-party advertisers.<\u002Fp>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">4. Third-Party Services<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">Reset uses the following third-party services to operate the app. These services may process your data according to their own privacy policies:<\u002Fp>\n    <div style=\"margin-top: 8px; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 20px -18px rgba(120,95,80,.4);\">\n      <sc-raw-table>\n        <sc-raw-tr><sc-raw-th>Service<\u002Fsc-raw-th><sc-raw-th>Provider<\u002Fsc-raw-th><sc-raw-th>Purpose<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Cloud Firestore<\u002Fsc-raw-td><sc-raw-td>Google Firebase<\u002Fsc-raw-td><sc-raw-td>Storing user accounts, habits, journals, and app content<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td>Firebase Storage<\u002Fsc-raw-td><sc-raw-td>Google Firebase<\u002Fsc-raw-td><sc-raw-td>Storing profile photos and e-book PDF files<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">You can review Google Firebase's privacy policy at <a href=\"https://firebase.google.com/support/privacy\">firebase.google.com/support/privacy<\u002Fa>.<\u002Fp>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">5. Data Storage &amp; Security<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">Your data is stored securely on Google Firebase servers. We implement reasonable technical and organisational measures to protect your personal information against unauthorised access, alteration, disclosure, or destruction.<\u002Fp>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">Some data (such as your login status and account information) is also cached locally on your device using secure on-device storage to enable offline access.<\u002Fp>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">While we strive to protect your data, <strong style=\"color: #3A2A22;\">no method of transmission over the internet is 100% secure<\u002Fstrong>. We encourage you to use a strong, unique password for your account.<\u002Fp>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">6. Data Retention<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">We retain your personal data for as long as your account is active or as needed to provide you with our services. If you delete your account, we will remove your personal data from our systems within a reasonable period, except where we are required to retain it by law.<\u002Fp>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">Journal entries, habit records, and other activity data are stored for the lifetime of your account to preserve your history and progress.<\u002Fp>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">7. Your Rights<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">You have the following rights regarding your personal data:<\u002Fp>\n    <ul style=\"font-size: 15px; line-height: 1.85; color: #5C4A42; padding-left: 20px;\">\n      <li><strong style=\"color: #3A2A22;\">Access:<\u002Fstrong> Request a copy of the personal data we hold about you<\u002Fli>\n      <li><strong style=\"color: #3A2A22;\">Correction:<\u002Fstrong> Update or correct inaccurate information through the app's profile settings<\u002Fli>\n      <li><strong style=\"color: #3A2A22;\">Deletion:<\u002Fstrong> Permanently delete your account and all associated data directly from the app — go to Profile → Delete Account. Deletion is immediate and irreversible.<\u002Fli>\n      <li><strong style=\"color: #3A2A22;\">Withdraw Consent:<\u002Fstrong> Opt out of non-essential data processing at any time by contacting us<\u002Fli>\n    <\u002Ful>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">To exercise any of these rights (other than account deletion, which is available in-app), please contact us at <strong style=\"color: #3A2A22;\">Laura@resetapp.co<\u002Fstrong>. We will respond to your request within 30 days.<\u002Fp>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">8. Local Notifications<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">Reset uses on-device local notifications to remind you about your habits and daily goals. These notifications are processed entirely on your device and do not involve sending your data to external servers. You can disable notifications at any time from your device's Settings.<\u002Fp>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">9. Children's Privacy<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">Reset is not directed to children under the age of 13. We do not knowingly collect personal information from children under 13. If you believe we have inadvertently collected information from a child under 13, please contact us immediately and we will take steps to delete such information.<\u002Fp>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">10. Changes to This Policy<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">We may update this Privacy Policy from time to time. When we do, we will update the \"Last Updated\" date at the top of this page. We encourage you to review this policy periodically to stay informed about how we protect your information.<\u002Fp>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">Continued use of Reset after changes are posted constitutes your acceptance of the revised Privacy Policy.<\u002Fp>\n\n    <div style=\"margin-top: 40px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 24px; color: #B08D80;\">11. Contact Us<\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 1.75; color: #5C4A42;\">If you have any questions, concerns, or requests regarding this Privacy Policy or our data practices, please reach out to us:<\u002Fp>\n\n    <div style=\"margin-top: 16px; border-radius: 18px; padding: 26px; text-align: center; background: linear-gradient(150deg, #C9AA9E 0%, #B08D80 100%);\">\n      <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 20px; color: #FFF9F2;\">Get in Touch<\u002Fdiv>\n      <div style=\"margin-top: 6px; font-size: 14px; color: rgba(255,249,242,.85);\">We're committed to addressing your privacy concerns promptly and transparently.<\u002Fdiv>\n      <div style=\"margin-top: 14px;\"><a href=\"mailto:Laura@resetapp.co\" style=\"color: #FFF9F2; font-weight: 700; font-size: 15px;\">Laura@resetapp.co<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top: 1px solid #E4D5C8; padding: 30px 32px; text-align: center;\">\n    <div style=\"font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 16px; color: #3A2A22;\">Reset<\u002Fdiv>\n    <div style=\"margin-top: 10px; display: flex; justify-content: center; gap: 22px;\">\n      <a href=\"index.html\" style=\"font-size: 13px; font-weight: 600; color: #7C6A62;\">Home<\u002Fa>\n      <a href=\"terms-of-use.html\" style=\"font-size: 13px; font-weight: 600; color: #7C6A62;\">Terms of Use<\u002Fa>\n      <a href=\"support.html\" style=\"font-size: 13px; font-weight: 600; color: #7C6A62;\">Support<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"margin-top: 10px; font-size: 12.5px; color: #9C8A80;\">© 2026 Reset. All rights reserved.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
